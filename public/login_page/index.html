<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disbattery Mercaderista - Inicio de Sesión</title>
    <link rel="stylesheet" href="login.css">
    <!-- Font Awesome para el ícono del ojo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <img src="https://storage.googleapis.com/iandai/imagenes/disbatterylogo.png" alt="Disbattery Logo" class="disbattery-logo-top">
    
    <div class="login-container">
        <div class="login-card">
            <img src="https://storage.googleapis.com/iandai/imagenes/disbatterylogo.png" alt="Disbattery Lubricantes Logo" class="disbattery-logo">
            
            <h1 class="title">Disbattery Mercaderista</h1>
            <p class="subtitle">por favor inicie sesión para continuar</p>
            
            <form>
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="email" id="username" placeholder="Ingrese su correo">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Ingrese su contraseña">
                        <i class="fa-solid fa-eye" id="togglePassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="login-button">Iniciar Sesión</button>
            </form>

            <a class="forgot-password-link">¿Olvidó su contraseña?</a>
        </div>
    </div>

    <img src="https://storage.googleapis.com/iandai/imagenes/shell.png" alt="Shell Logo" class="shell-logo-bottom">

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Firebase SDK - Versión estable -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Configuración de Firebase de tu proyecto - CORREGIDA
        const firebaseConfig = {
            apiKey: "AIzaSyCs73uDqTGuoy2u0fnZgngTqRWhuyIU5l8",
            authDomain: "disbattery-trade.firebaseapp.com",
            projectId: "disbattery-trade",
            storageBucket: "disbattery-trade.firebasestorage.app",
            messagingSenderId: "614937382806",
            appId: "1:614937382806:web:5df489972e5eb4365117b7"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Funcionalidad de ver/ocultar contraseña
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const emailInput = document.querySelector('#username');

        togglePassword.addEventListener('click', function (e) {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Funcionalidad de Iniciar Sesión
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) {
                showToast("Por favor, ingrese su usuario y contraseña.");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    showToast("¡Login exitoso! Redirigiendo...");
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error('Error de login:', error);
                    console.error('Código de error:', error.code);
                    console.error('Mensaje de error:', error.message);
                    
                    let errorMessage = "Ocurrió un error. Por favor, verifique sus credenciales.";
                    
                    switch(error.code) {
                        case 'auth/user-not-found':
                            errorMessage = "Usuario no encontrado. Verifique su correo electrónico.";
                            break;
                        case 'auth/wrong-password':
                            errorMessage = "Contraseña incorrecta. Intente nuevamente.";
                            break;
                        case 'auth/invalid-credential':
                            errorMessage = "Credenciales inválidas. Verifique sus datos.";
                            break;
                        case 'auth/invalid-email':
                            errorMessage = "El formato del correo electrónico es inválido.";
                            break;
                        case 'auth/user-disabled':
                            errorMessage = "Esta cuenta ha sido deshabilitada.";
                            break;
                        case 'auth/too-many-requests':
                            errorMessage = "Demasiados intentos fallidos. Espere un momento.";
                            break;
                        default:
                            errorMessage = `Error: ${error.code} - ${error.message}`;
                    }
                    showToast(errorMessage);
                });
        });

        // Funcionalidad de recuperar contraseña
        const forgotPasswordLink = document.querySelector('.forgot-password-link');
        forgotPasswordLink.addEventListener('click', function() {
            const email = emailInput.value;
            if (!email) {
                showToast("Por favor, ingrese su dirección de correo electrónico en el campo 'Usuario'.");
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    showToast(`Se ha enviado un correo de recuperación a ${email}. Por favor, revise su bandeja de entrada.`);
                })
                .catch((error) => {
                    showToast(`Error al enviar el correo: ${error.message}`);
                });
        });

        // Toast function
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            // Hide after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
